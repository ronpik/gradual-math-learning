# Alembic configuration for the math-practice backend.
#
# Migrations ship inside the package directory so they travel with the wheel.
# The database URL is intentionally left blank here: env.py resolves it from
# MATH_PRACTICE_DATABASE_URL (or settings.database_url) so the same migration
# stack targets in-memory/file SQLite (dev/tests) and Postgres (deploy)
# without committing credentials to source control.

[alembic]
# Path to migration scripts. ``%(here)s`` anchors to this ini file's directory
# so the same command works regardless of the current working directory (e.g.
# ``alembic -c /abs/path/alembic.ini upgrade head`` invoked from the repo root).
script_location = %(here)s/migrations

# Make the backend package importable when invoking alembic from anywhere.
prepend_sys_path = %(here)s/src

# Use os.pathsep-separated paths; left as the default.
# version_path_separator = os

# URL is supplied by env.py; leave blank.
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
