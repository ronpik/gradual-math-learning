[project]
name = "math-practice-backend"
version = "0.1.0"
description = "HTTP backend (FastAPI) for the adaptive math practice engine."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "google-auth",
    "requests",
    "math-practice",
]

[project.optional-dependencies]
dev = ["httpx", "pytest"]
postgres = ["psycopg[binary]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_practice_backend"]

[tool.uv.sources]
math-practice = { workspace = true }
