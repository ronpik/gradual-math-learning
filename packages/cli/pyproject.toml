[project]
name = "math-practice-cli"
version = "0.1.0"
description = "Command-line interface for the adaptive math practice engine."
requires-python = ">=3.11"
dependencies = ["math-practice"]

[project.scripts]
math-practice = "math_practice_cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_practice_cli"]

[tool.uv.sources]
math-practice = { workspace = true }
