[project]
name = "math-practice-client"
version = "0.1.0"
description = "HTTP client / CLI for the adaptive math practice backend."
requires-python = ">=3.11"
dependencies = ["httpx"]

[project.scripts]
math-practice-client = "math_practice_client.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_practice_client"]
