[tool.uv.workspace]
members = ["packages/*"]
# The static web client is a JS/TS package (Vite + React); it is not a Python
# project, so keep uv from trying to resolve it as a workspace member.
exclude = ["packages/web-client-static"]

# Optional tooling, not part of the app runtime.
# `scripts/plot_curves.py` renders the spec's formula figures.
# Default `uv sync` stays lean/offline; bring these in with:
#     uv sync --group plots
[dependency-groups]
plots = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "seaborn>=0.13",
]
